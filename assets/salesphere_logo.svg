<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <!-- Vibrant Gradient Definitions -->
    <linearGradient id="spherePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="sphereAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Ambient Circle -->
    <circle cx="45" cy="45" r="40" fill="none" stroke="url(#spherePrimary)" stroke-width="1.8" opacity="0.4" stroke-dasharray="8 4" />
    
    <!-- Core Spherical Gradient Disc -->
    <circle cx="45" cy="45" r="34" fill="url(#spherePrimary)" filter="url(#neonGlow)" opacity="0.95" />
    
    <!-- Orbit Ring 1 -->
    <ellipse cx="45" cy="45" rx="38" ry="14" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8" transform="rotate(-25 45 45)" />
    
    <!-- Orbit Ring 2 (Cross Accent) -->
    <ellipse cx="45" cy="45" rx="36" ry="12" fill="none" stroke="url(#sphereAccent)" stroke-width="2.5" opacity="0.9" transform="rotate(35 45 45)" />
    
    <!-- Embedded Sales Growth Nodes -->
    <path d="M 27,55 L 37,45 L 47,50 L 63,30" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="63" cy="30" r="4.5" fill="#FFFFFF" filter="url(#neonGlow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(105, 0)">
    <text x="0" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="url(#logoTextGrad)" letter-spacing="-0.8">Sales<tspan fill="#06B6D4">Sphere</tspan></text>
    <text x="2" y="82" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#A855F7" letter-spacing="2.2" opacity="0.95">CUSTOMER INTELLIGENCE</text>
  </g>
</svg>
